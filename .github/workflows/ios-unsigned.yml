name: iOS unsigned ipa
# Builds HouseCapture without signing so it can be signed and sideloaded from
# Windows (Sideloadly). Manual only: macOS minutes are free on public repos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: apps/house-capture
        run: xcodegen generate

      - name: Build without signing
        working-directory: apps/house-capture
        run: |
          set -o pipefail
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 80

      - name: Package ipa
        working-directory: apps/house-capture
        run: |
          APP="build/Build/Products/Release-iphoneos/HouseCapture.app"
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry HouseCapture-unsigned.ipa Payload
          ls -lh HouseCapture-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: HouseCapture-unsigned-ipa
          path: apps/house-capture/HouseCapture-unsigned.ipa
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: apps/house-capture/build.log
          retention-days: 3
